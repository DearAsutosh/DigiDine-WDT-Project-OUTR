<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DigiDine</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-login">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-fire me-2"></i> DigiDine
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                         <button class="btn nav-link" id="theme-toggle" aria-label="Toggle Dark Mode"><i class="bi bi-moon-stars-fill"></i></button>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-light rounded-pill px-3 fw-bold" href="login.html">Login</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link position-relative btn btn-light px-3 rounded-pill" href="cart.html">
                            <i class="bi bi-bag-fill text-success"></i> Cart
                            <span class="badge rounded-pill cart-badge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-5">
        <div class="row min-vh-75 align-items-center">
            <!-- Info Side -->
            <div class="col-md-6 mb-4 mb-md-0">
                <div class="p-4">
                    <h1 class="display-4 fw-bold">Hungry?</h1>
                    <p class="lead text-muted">Order food from best restaurants near you.</p>
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1000&auto=format&fit=crop" class="img-fluid rounded-3 shadow-sm" alt="Delivery">
                </div>
            </div>

            <!-- Form Side -->
            <div class="col-md-5 offset-md-1">
                <!-- Login Box -->
                <div id="login-box" class="card border-0 shadow-lg p-4 animate-fade-in">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="fw-bold mb-0">Login</h3>
                            <i class="bi bi-fire text-brand display-6"></i>
                        </div>
                        
                        <form id="login-form">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                                <label for="login-email">Email address</label>
                            </div>
                            <div class="input-group mb-3">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="login-pass" placeholder="Password" required>
                                    <label for="login-pass">Password</label>
                                </div>
                                <span class="input-group-text bg-white toggle-password" data-target="login-pass" style="cursor: pointer;">
                                    <i class="bi bi-eye-slash"></i>
                                </span>
                            </div>
                            <button type="submit" class="btn btn-brand w-100 py-3 fw-bold shadow-sm">LOGIN</button>
                        </form>

                        <div class="text-center mt-3 small">
                            <span class="text-muted">New here?</span> 
                            <a href="#" id="show-register" class="fw-bold text-decoration-none" style="color: var(--brand-color);">Create an account</a>
                        </div>
                    </div>
                </div>

                <!-- Register Box -->
                <div id="register-box" class="card border-0 shadow-lg p-4 animate-fade-in d-none">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="fw-bold mb-0">Sign Up</h3>
                            <button class="btn-close" id="show-login" aria-label="Close"></button>
                        </div>
                        
                        <form id="register-form">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required>
                                <label for="reg-name">Full Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
                                <label for="reg-email">Email address</label>
                            </div>
                            <div class="d-flex gap-3 mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="role-customer" value="customer" checked>
                                    <label class="form-check-label" for="role-customer">Customer</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="role-owner" value="owner">
                                    <label class="form-check-label" for="role-owner">Restaurant Owner</label>
                                </div>
                            </div>
                            <div id="restaurant-name-group" class="d-none">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="reg-restaurant" placeholder="My Cafe">
                                    <label for="reg-restaurant">Restaurant Name</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="reg-location" placeholder="Patia">
                                    <label for="reg-location">Restaurant Location (e.g. Patia)</label>
                                </div>
                            </div>
                            <div class="input-group mb-3">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="reg-pass" placeholder="Password" required>
                                    <label for="reg-pass">Password</label>
                                </div>
                                <span class="input-group-text bg-white toggle-password" data-target="reg-pass" style="cursor: pointer;">
                                    <i class="bi bi-eye-slash"></i>
                                </span>
                            </div>
                            <button type="submit" class="btn btn-brand w-100 py-3 fw-bold shadow-sm">CONTINUE</button>
                        </form>

                        <div class="text-center mt-3 small">
                            <span class="text-muted">By creating an account, I accept the Terms & Conditions & Privacy Policy</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
